services:
  backend:
    build: ./backend
    container_name: raffle-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    volumes:
      - raffle-data:/data
    networks:
      - internal

  frontend:
    build: ./frontend
    container_name: raffle-frontend
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - internal
      - proxy

volumes:
  raffle-data:

networks:
  internal:
  proxy:
    external: true